name: Source snapshot and follow-up audit
on:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: windows-2025
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Archive tracked source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force source-artifact | Out-Null
          git archive --format=zip --output=source-artifact/AIUsage-source.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Archive failed.' }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Independent second-audit reproductions
        shell: pwsh
        run: |
          dotnet run --project tests/AIUsage.FollowupTests -c Release 2>&1 | Tee-Object source-artifact/followup-tests.txt
          if ($LASTEXITCODE -ne 0) { throw 'Follow-up regressions failed.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-snapshot
          path: source-artifact/*
          retention-days: 14
          if-no-files-found: error
