name: Windows build, tests and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Synthetic regression tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          dotnet run --project tests/AIUsage.Tests/AIUsage.Tests.csproj -c Release 2>&1 | Tee-Object artifacts/regression-tests.txt
          if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed.' }
      - name: Independent audit regression tests
        shell: pwsh
        run: |
          dotnet run --project tests/AIUsage.AuditTests -c Release 2>&1 | Tee-Object artifacts/audit-tests.txt
          if ($LASTEXITCODE -ne 0) { throw 'Audit regression tests failed.' }
      - name: English and Spanish localization tests
        shell: pwsh
        run: |
          dotnet run --project tests/AIUsage.LocalizationTests -c Release 2>&1 | Tee-Object artifacts/localization-tests.txt
          if ($LASTEXITCODE -ne 0) { throw 'Localization regression tests failed.' }
      - name: Second-audit regressions
        shell: pwsh
        run: |
          dotnet run --project tests/AIUsage.FollowupTests -c Release 2>&1 | Tee-Object artifacts/followup-tests.txt
          if ($LASTEXITCODE -ne 0) { throw 'Follow-up regressions failed.' }
      - name: Third-audit security and large-cache regressions
        shell: pwsh
        run: |
          dotnet run --project tests/AIUsage.SecurityTests -c Release -- --stress 2>&1 | Tee-Object artifacts/security-tests.txt
          if ($LASTEXITCODE -ne 0) { throw 'Security regressions failed.' }
      - name: Reject silent dotnet test success
        shell: pwsh
        run: |
          foreach ($project in @('AIUsage.Tests', 'AIUsage.AuditTests', 'AIUsage.LocalizationTests', 'AIUsage.FollowupTests', 'AIUsage.OfflineTests', 'AIUsage.SecurityTests', 'AIUsage.DesktopTests')) {
            $output = & dotnet test "tests/$project" -c Release 2>&1 | Out-String
            $code = $LASTEXITCODE
            $output | Add-Content artifacts/test-runner-guard.txt
            if ($code -eq 0 -or $output -notmatch 'AIU0001') { throw "Missing executable-runner guard for $project" }
          }
          $global:LASTEXITCODE = 0
      - name: Build native Windows UI
        shell: pwsh
        run: |
          dotnet build src/AIUsage.Windows/AIUsage.Windows.csproj -c Release -p:PublishSingleFile=false -p:ContinuousIntegrationBuild=true
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed.' }
      - name: Publish portable x64 and ARM64 with complete notices
        shell: pwsh
        run: |
          foreach ($rid in @('win-x64', 'win-arm64')) {
            dotnet publish src/AIUsage.Windows/AIUsage.Windows.csproj -c Release -r $rid --self-contained true -o "artifacts/publish/$rid" -p:ContinuousIntegrationBuild=true
            if ($LASTEXITCODE -ne 0) { throw "Publish failed for $rid" }
            & ./scripts/collect-notices.ps1 -Runtime $rid -PublishDirectory "artifacts/publish/$rid"
            Copy-Item README.md, LICENSE, THIRD-PARTY-NOTICES.md "artifacts/publish/$rid"
            Copy-Item docs "artifacts/publish/$rid/docs" -Recurse -Force
            & ./scripts/verify-package.ps1 -PublishDirectory "artifacts/publish/$rid" -Runtime $rid | Tee-Object -Append artifacts/package-tests.txt
          }
      - name: Local-only source, assembly and functional guards
        shell: pwsh
        run: |
          dotnet run --project tests/AIUsage.OfflineTests -c Release -- --repo-root "$env:GITHUB_WORKSPACE" --app-assembly artifacts/publish/win-x64/AIUsage.dll --app-assembly artifacts/publish/win-arm64/AIUsage.dll --app-assembly artifacts/publish/win-x64/AIUsage.Core.dll --app-assembly artifacts/publish/win-arm64/AIUsage.Core.dll 2>&1 | Tee-Object artifacts/offline-tests.txt
          if ($LASTEXITCODE -ne 0) { throw 'Local-only regression guards failed.' }
      - name: Execute x64 local-only and bilingual WPF smoke tests
        shell: pwsh
        run: |
          & ./scripts/verify-local-runtime.ps1 -Executable artifacts/publish/win-x64/AIUsage.exe -Destination artifacts/screenshots
      - name: Published x64 actual-entry-point and startup-hook regression tests
        shell: pwsh
        run: |
          dotnet build tests/AIUsage.StartupHook -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Hook fixture build failed.' }
          dotnet run --project tests/AIUsage.DesktopTests -c Release -- artifacts/publish/win-x64/AIUsage.exe tests/AIUsage.StartupHook/bin/Release/net10.0/AIUsage.StartupHook.dll tests/AIUsage.SecurityTests/bin/Release/net10.0/AIUsage.SecurityTests.dll 2>&1 | Tee-Object artifacts/desktop-tests.txt
          if ($LASTEXITCODE -ne 0) { throw 'Published desktop regressions failed.' }
      - name: Package and hash
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid version.' }
          $tag = (Get-Content RELEASE_TAG -Raw).Trim()
          if ($tag -notmatch ('^v' + [regex]::Escape($version) + '(-r[0-9]+)?$')) { throw 'Tag/version mismatch.' }
          $packageVersion = $tag.Substring(1)
          $sourceVersion = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          if ($sourceVersion -ne $version) { throw 'Assembly/package version mismatch.' }
          $manifestVersion = ([xml](Get-Content src/AIUsage.Windows/app.manifest -Raw)).assembly.assemblyIdentity.version
          if ($manifestVersion -ne "$version.0") { throw 'Manifest/package version mismatch.' }
          if ((Get-ChildItem artifacts/screenshots -Filter 'AIUsage-*.png').Count -ne 8) { throw 'Missing bilingual smoke screenshots.' }
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          foreach ($rid in @('win-x64', 'win-arm64')) {
            $notices = Get-ChildItem "artifacts/publish/$rid/runtime-notices" -File -Filter '*.TXT'
            if ($notices.Count -ne 6) { throw "Runtime notices missing for $rid" }
            Compress-Archive -Path "artifacts/publish/$rid/*" -DestinationPath "artifacts/release/AIUsage-$packageVersion-$rid.zip" -CompressionLevel Optimal
          }
          git archive --format=zip --output="artifacts/release/AIUsage-$packageVersion-source.zip" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed.' }
          Copy-Item artifacts/screenshots/*.png artifacts/release
          Copy-Item artifacts/security-tests.txt, artifacts/desktop-tests.txt, artifacts/package-tests.txt artifacts/release
          Copy-Item artifacts/regression-tests.txt, artifacts/audit-tests.txt, artifacts/localization-tests.txt, artifacts/followup-tests.txt, artifacts/offline-tests.txt, artifacts/test-runner-guard.txt, artifacts/screenshots/local-runtime-test.txt artifacts/release
          @{
            repository = $env:GITHUB_REPOSITORY
            commit = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            version = $version
            release_tag = $tag
            dotnet_sdk = (& dotnet --version)
            runner_os = $env:RUNNER_OS
            runtime_validation = 'Published x64 actual entry point, mutex/tray/timers, settings recovery, disabled startup hook; bilingual smoke. Published x64/ARM64 API allowlists; ARM64 not executed.'
            connectivity = 'Local-only runtime; authenticated client removed. Build/release tooling uses the internet.'
          } | ConvertTo-Json | Set-Content artifacts/release/BUILD-INFO.json -Encoding utf8NoBOM
          Get-ChildItem artifacts/release -File | Sort-Object Name | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content artifacts/release/SHA256SUMS.txt -Encoding utf8NoBOM
      - name: Upload release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostics (synthetic only)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-diagnostics
          path: |
            artifacts/security-tests.txt
            artifacts/desktop-tests.txt
            artifacts/package-tests.txt
            artifacts/regression-tests.txt
            artifacts/audit-tests.txt
            artifacts/localization-tests.txt
            artifacts/followup-tests.txt
            artifacts/offline-tests.txt
            artifacts/test-runner-guard.txt
            artifacts/screenshots/*
          if-no-files-found: ignore
          retention-days: 14
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]'))
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release
          path: release-files
      - name: Publish verified Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(tr -d '\r\n' < VERSION)
          TAG=$(tr -d '\r\n' < RELEASE_TAG)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-r[0-9]+)?$ ]] || exit 1
          [[ "$TAG" == "v$VERSION" || "$TAG" == "v$VERSION"-r* ]] || exit 1
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Update VERSION / RELEASE_TAG before another release."
            exit 1
          fi
          gh release create "$TAG" release-files/* --target "$GITHUB_SHA" --latest --title "AIUsage $TAG · Windows" --notes-file docs/RELEASE-NOTES.md
